name: Nova Health Monitor
on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nova-health
  cancel-in-progress: false
jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Federation URLs
        shell: bash
        run: |
          DATE=$(date -u +%Y-%m-%d-%H)
          REPORT="health-reports/${DATE}.md"
          printf '# Health Report %s UTC\n\n| URL | Status |\n|-----|--------|\n' "$DATE" > "$REPORT"
          FAILED=0
          URLS=(
            "https://nextxus.online"
            "https://nextxus.org"
            "https://nextxus.studio"
            "https://nextxus.tech"
            "https://nextxus.space"
            "https://nextxus.help"
            "https://next-xus.com"
            "https://keywebco.github.io"
            "https://keywebco.github.io/nextxus-sim/"
            "https://keywebco.github.io/nextxus-sim/roger-sim.html"
            "https://keywebco.github.io/ring-of-12/"
            "https://keywebco.github.io/ring-of-three/"
            "https://keywebco.github.io/plexus-relay/"
            "https://keywebco.github.io/nextxus-blog/"
            "https://keywebco.github.io/nextxus-tools/"
            "https://keywebco.github.io/sovereigntools/"
            "https://keywebco.github.io/roger-keyserling/"
            "https://keywebco.github.io/nextxus-ai-minds-lab/"
            "https://roger-sim-api.onrender.com/health"
            "https://ring-of-12-api.onrender.com/health"
          )
          for url in "${URLS[@]}"; do
            STATUS=$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 "$url") || STATUS=000
            if [ "$STATUS" = 200 ]; then
              printf '| %s | ✅ %s |\n' "$url" "$STATUS" >> "$REPORT"
            else
              printf '| %s | ❌ %s |\n' "$url" "$STATUS" >> "$REPORT"
              FAILED=$((FAILED+1))
            fi
          done
          printf '\nFailed: %s / 20\n' "$FAILED" >> "$REPORT"
          if [ "$FAILED" -gt 0 ]; then
            echo "$FAILED Federation URLs failed; committing the report before marking run failed."
            exit 1
          fi
      - name: Commit report even when checks fail
        if: ${{ always() }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add health-reports/
          if ! git diff --cached --quiet; then
            git commit -m "Nova health report $(date -u +%Y-%m-%d-%H)"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
